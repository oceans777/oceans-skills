name: AI generation site skill contracts
on:
  push:
    paths:
      - "skills/audit-ai-generation-site/**"
      - ".github/workflows/audit-ai-generation-site.yml"
  pull_request:
    paths:
      - "skills/audit-ai-generation-site/**"
      - ".github/workflows/audit-ai-generation-site.yml"
permissions:
  contents: read
jobs:
  contract-tests:
    name: Skill contracts (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: 检查文档契约及故意破坏的反例
        run: python -m unittest discover -s skills/audit-ai-generation-site/tests -p "test_*.py" -v
