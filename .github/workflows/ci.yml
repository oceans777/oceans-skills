name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Check skill structure
        run: |
          for skill in skills/*; do
            test -f "$skill/SKILL.md"
          done
      - name: Run Shell tests
        run: sh tests/test-agent-operating-system.sh

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check skill structure
        shell: pwsh
        run: |
          Get-ChildItem skills -Directory | ForEach-Object {
            if (-not (Test-Path (Join-Path $_.FullName 'SKILL.md'))) {
              throw "Missing SKILL.md: $($_.Name)"
            }
          }
      - name: Run PowerShell tests
        shell: pwsh
        run: .\tests\test-agent-operating-system.ps1

  idea-ledger:
    name: Idea Ledger (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Show Python version
        run: python --version
      - name: Compile Idea Ledger
        run: python -m compileall -q skills/idea-ledger/scripts
      - name: Run Idea Ledger tests
        run: python -m unittest discover -s skills/idea-ledger/tests -p "test_*.py" -v
