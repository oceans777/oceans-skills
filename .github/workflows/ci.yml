name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        test:
          - test-agent-operating-system.sh
          - test-discuz-x5.sh
          - test-first-party-contracts.sh
    name: shell (${{ matrix.os }}, ${{ matrix.test }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check skill structure
        run: |
          for skill in skills/*; do
            test -f "$skill/SKILL.md"
          done
      - name: Run test
        shell: sh
        run: sh "tests/${{ matrix.test }}"

  powershell-parse:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Parse PowerShell files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }

  powershell-tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-agent-operating-system.ps1
          - test-discuz-x5.ps1
          - test-first-party-contracts.ps1
    name: powershell (${{ matrix.test }})
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check skill structure
        shell: pwsh
        run: |
          Get-ChildItem skills -Directory | ForEach-Object {
            if (-not (Test-Path (Join-Path $_.FullName 'SKILL.md'))) {
              throw "Missing SKILL.md: $($_.Name)"
            }
          }
      - name: Run test
        shell: pwsh
        run: "& .\\tests\\${{ matrix.test }}"
